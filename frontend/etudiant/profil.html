<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil - MMI Meaux Stages</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col">

    <nav class="bg-blue-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-bold tracking-wide">MMI Meaux</span>
                <span class="bg-blue-700 text-xs px-2 py-1 rounded-sm uppercase font-semibold text-blue-200">Stages</span>
            </div>
            <div class="flex items-center space-x-6 text-sm font-medium">
                <a href="accueil.html" class="hover:text-blue-200 transition">Accueil</a>
                <a href="voir-stage.html" class="hover:text-blue-200 transition">Mes Stages</a>
                <a href="soutenance.html" class="hover:text-blue-200 transition">Soutenance</a>
                <a href="profil.html" class="text-blue-200 font-bold transition">Mon Profil</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-10">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="bg-blue-900 text-white px-6 py-6">
                <h1 class="text-2xl font-bold">Fiche Informations Étudiant</h1>
                <p class="text-sm text-blue-200 mt-1">Complétez et modifiez vos données obligatoires pour l'édition des conventions de stages.</p>
            </div>
            
            <form class="p-6 space-y-6">
                <div>
                    <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3">1. État Civil & Contact</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Nom</label>
                            <input type="text" value="Dupont" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Prénom</label>
                            <input type="text" value="Jean" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Téléphone</label>
                            <input type="tel" value="06 12 34 56 78" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                </div>

                <div class="pt-4 border-t border-gray-100">
                    <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3">2. Scolarité & Scolarisation</h2>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Matricule / N° Étudiant</label>
                            <input type="text" value="22304591" class="w-full px-3 py-2 border border-gray-300 bg-gray-50 text-gray-500 rounded-lg text-sm" readonly>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Promotion</label>
                            <select class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                                <option>BUT MMI 1</option>
                                <option selected>BUT MMI 2</option>
                                <option>BUT MMI 3</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Groupe TD</label>
                            <input type="text" value="TD1" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Groupe TP</label>
                            <input type="text" value="TP1A" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                        </div>
                    </div>
                </div>

                <div class="pt-4 border-t border-gray-100">
                    <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3">3. Compléments Légaux</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Date de Naissance</label>
                            <input type="date" value="2005-04-12" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Lieu de Naissance</label>
                            <input type="text" value="Meaux (77)" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Adresse Postale Complète</label>
                        <input type="text" value="12 Rue de la République, 77100 Meaux" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                    </div>
                </div>

                <div class="flex justify-end pt-4 border-t border-gray-100">
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2.5 rounded-xl font-semibold text-sm hover:bg-blue-700 transition">
                        Enregistrer les modifications
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-gray-900 text-gray-300 border-t border-gray-800 mt-auto py-6 text-center text-xs">
        &copy; 2026 BUT MMI Meaux
    </footer>
</body>
</html>
